name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # One app, two sites (ADR 805): every gate runs against both builds.
    strategy:
      fail-fast: false
      matrix:
        site: [idml, paged]
    env:
      SITE: ${{ matrix.site }}
      # With the source token, a source that cannot be pulled fails the build
      # (pull-sources strict mode); without it (forks) public sources only.
      DOCS_SOURCES_STRICT: ${{ secrets.DOCS_SOURCES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: manifest integrity (cheap, no renderer)
        run: pnpm examples:index
      - name: InDesign stamps match their packages (cheap, no InDesign)
        run: pnpm examples:verify

      - name: generate cross-repo docs data (registry, catalogs, activity)
        # Pulls the pinned sources (sources.pin) into .generated/ via the gh CLI.
        # DOCS_SOURCES_TOKEN is a PAT with read access to the PRIVATE source repos
        # (state, plugin-sdk, editor-server, …); the default GITHUB_TOKEN can only
        # read this repo + public ones. On a PR/fork without the PAT this degrades
        # to public sources only and the ref/freshness checks skip — the
        # token-equipped main build does the real gating.
        run: pnpm generate:docs
        env:
          GH_TOKEN: ${{ secrets.DOCS_SOURCES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: capability record is recent (cockpit export ≤ 7 days)
        if: env.DOCS_SOURCES_STRICT == 'true'
        run: pnpm check:record-age
      - name: no hand-typed platform numbers (use <Fact>)
        run: pnpm check:facts
      - name: comparison scores rest on verified capabilities; competitor research is recent
        if: env.DOCS_SOURCES_STRICT == 'true'
        run: pnpm check:comparison

      - name: feature-ref integrity (every feature=/chapter= resolves in the registry)
        run: pnpm check:feature-refs
      - name: 'prose freshness guard (describes:/reviewed: pages not stale)'
        run: pnpm check:freshness

      - run: pnpm typecheck
      - name: build (also fails on broken example imports / MDX)
        run: pnpm build
        env:
          # GithubInfo (layout.config.tsx) fetches repo stats during SSG, and
          # generate:docs (re-run by build) pulls the cross-repo sources.
          GH_TOKEN: ${{ secrets.DOCS_SOURCES_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: keep the export for the browser tests
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.site }}
          path: out
          retention-days: 3

  browsers:
    # Each site's export in Chromium, Firefox and WebKit (tests/browsers/).
    # macOS, because Playwright's WebKit runs there without system packages:
    # on Linux it needs `--with-deps`, i.e. apt, which has hung CI runs before.
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        site: [idml, paged]
    env:
      SITE: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      - uses: actions/download-artifact@v4
        with:
          name: out-${{ matrix.site }}
          path: out
      - name: install the three browsers
        run: pnpm exec playwright install chromium firefox webkit
        timeout-minutes: 10
      - name: browser tests (${{ matrix.site }})
        run: pnpm test:browsers
        timeout-minutes: 15
      - name: keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces-${{ matrix.site }}
          path: test-results
          retention-days: 7
