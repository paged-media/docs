name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: manifest integrity (cheap, no renderer)
        run: pnpm examples:index
      - name: support-badge ↔ renderer-gaps drift check
        run: pnpm check:badges
      - run: pnpm typecheck
      - name: build (also fails on broken example imports / MDX)
        run: pnpm build
