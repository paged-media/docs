name: cloudflare-pages

# Deploy both static exports to CLOUDFLARE PAGES (ADR 804: the origin must send
# COOP/COEP for the live preview). One app, two sites (ADR 805):
#
#   SITE=idml   → project paged-idml  → idml.paged.media
#   SITE=paged  → project paged-docs  → docs.paged.media
#
# Actions builds, wrangler direct-uploads `out/`; the gh CLI + DOCS_SOURCES_TOKEN
# generate pipeline runs on the runner (Cloudflare's build image has no gh, which
# is why we build here rather than use CF git-integration).
#
# Freshness triggers: a docs edit (push), nightly source refresh (cron), and a
# source repo ping (repository_dispatch: source-updated).
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  repository_dispatch:
    types: [source-updated]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: idml
            project: paged-idml
          - site: paged
            project: paged-docs
    # One deploy per site at a time; don't cancel an in-progress production deploy.
    concurrency:
      group: cloudflare-pages-${{ matrix.site }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: build static export (out/) for ${{ matrix.site }}
        # prepare:preview stages the live-preview wasm from @paged-media/viewer;
        # generate:docs (run by build) pulls cross-repo sources via the gh CLI.
        run: pnpm build
        env:
          SITE: ${{ matrix.site }}
          GH_TOKEN: ${{ secrets.DOCS_SOURCES_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A source that cannot be pulled fails the deploy rather than publishing
          # old or empty capability data.
          DOCS_SOURCES_STRICT: ${{ secrets.DOCS_SOURCES_TOKEN != '' }}

      - name: deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The project (direct-upload type) must exist — create it once:
          #   wrangler pages project create <project> --production-branch=main
          # and attach its custom domain in the Cloudflare dashboard.
          # --branch=main marks this a PRODUCTION deploy (served at the custom domain).
          command: pages deploy out --project-name=${{ matrix.project }} --branch=main

      - name: rebuild paged.media from the new capability record
        # paged.media reads /capabilities.json and /facts.json at build time.
        # paged-website is a Git-connected Pages project in the same account,
        # so the deploy token can start a build of its main branch through the
        # Pages API; a deploy hook (SITE_DEPLOY_HOOK), when set, is used instead.
        # A failure here warns: the docs are already deployed.
        if: matrix.site == 'paged'
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$SITE_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$SITE_DEPLOY_HOOK" > /dev/null && echo "paged.media: deploy hook called"
            exit 0
          fi
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/paged-website/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -F branch=main)
          if echo "$response" | jq -e '.success' > /dev/null; then
            echo "paged.media: build $(echo "$response" | jq -r '.result.id') started from main"
          else
            echo "::warning::paged.media was not rebuilt: $(echo "$response" | jq -c '.errors')"
          fi
