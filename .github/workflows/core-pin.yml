name: core-pin
# core.pin tracks the latest engine RELEASE tag (policy in its header). The
# engine lives in the monorepo paged-media/paged (engine/core), whose v* tags are
# the engine releases. Nightly, when a newer v* tag exists, commit the bump
# straight to main and run the gates (examples, scripting, build) and the deploy
# on it: a push made with the Actions token starts no workflow by itself, so
# they are dispatched. A red gate is fixed forward on main.
on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the latest engine release tag (paged-media/paged v* tags)
        id: tag
        run: |
          latest=$(git ls-remote --tags --refs https://github.com/paged-media/paged.git 'v*' \
            | awk '{print $2}' | sed 's|refs/tags/||' | sort -V | tail -1)
          sha=$(git ls-remote https://github.com/paged-media/paged.git "refs/tags/$latest^{}" | awk '{print $1}')
          [ -z "$sha" ] && sha=$(git ls-remote https://github.com/paged-media/paged.git "refs/tags/$latest" | awk '{print $1}')
          current=$(grep -o 'Currently: v[0-9.]*' core.pin | sed 's/Currently: //')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "core.pin: $current; latest tag: $latest ($sha)"
      - name: Commit the bump to main and run the gates on it
        if: steps.tag.outputs.latest != steps.tag.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.tag.outputs.latest }}
          SHA: ${{ steps.tag.outputs.sha }}
          CURRENT: ${{ steps.tag.outputs.current }}
        run: |
          old=$(grep -v '^#' core.pin | grep -m1 .)
          sed -i "s/^$old\$/$SHA/" core.pin
          sed -i "s/^# Currently: $CURRENT (tag commit [0-9a-f]*)\./# Currently: $LATEST (tag commit ${SHA:0:7})./" core.pin
          git config user.name "core-pin[bot]"
          git config user.email "core-pin@users.noreply.github.com"
          git commit -qam "deps: core.pin → $LATEST (${SHA:0:7})"
          git push -q origin HEAD:main
          for wf in examples.yml scripting.yml build.yml cloudflare-pages.yml; do
            gh workflow run "$wf" --ref main
          done
          echo "core.pin → $LATEST pushed to main; gates and deploy dispatched."
