name: scripting

on:
  pull_request:
    paths:
      - 'data/scripting/**'
      - 'scripts/scripting/**'
      - 'core.pin'
      - '.github/workflows/scripting.yml'
  push:
    branches: [main]
  # core-pin pushes the pin bump with the Actions token, which starts no
  # push runs, and dispatches this workflow instead.
  workflow_dispatch:
  schedule:
    # Weekly core-drift check: re-validate the example corpus against core@main.
    - cron: '0 6 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: resolve core ref
        id: core
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "ref=main" >> "$GITHUB_OUTPUT"   # drift check: latest
          else
            echo "ref=$(grep -v '^#' core.pin | head -1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          fi

      # The engine lives in the monorepo paged-media/paged at engine/core;
      # the checkout lands at ./core, so the workspace is ./core/engine/core.
      - name: checkout the monorepo (public, no token needed)
        uses: actions/checkout@v4
        with:
          repository: paged-media/paged
          ref: ${{ steps.core.outputs.ref }}
          path: core

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/engine/core
          key: ${{ steps.core.outputs.ref }}

      - name: build paged-run (the headless NDJSON engine session)
        run: cargo build --release --manifest-path core/engine/core/Cargo.toml -p paged-run

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Pull the engine's scripting catalog so the membership check sees the
      # functions/paths the pinned engine actually ships. gh needs a token
      # (same wiring as build.yml/cloudflare-pages.yml) — without one EVERY
      # pull-sources fetch fails, the catalog loads empty, and the pin check
      # ✗s every path (the lane's standing red since 2026-07-27).
      - name: generate catalog
        run: pnpm generate:docs
        env:
          GH_TOKEN: ${{ secrets.DOCS_SOURCES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: check the example corpus is pinned to the catalog
        run: pnpm check:scripting

      - name: execute every example + seed against the engine
        run: PAGED_RUN="$PWD/core/engine/core/target/release/paged-run" pnpm validate:scripting
