name: pages

# Build the static export (Next.js output: 'export') and deploy to GitHub Pages
# at docs.paged.media. The WebGPU live-preview wasm is staged from the published
# @paged-media/idml-viewer npm package (its bundled wasm) by the build's
# prepare:preview step — no core checkout, no Rust toolchain in this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: build static export (out/)
        # `pnpm build` runs prepare:preview first — it copies the live-preview
        # wasm out of the installed @paged-media/idml-viewer package into
        # public/preview and runs the binaryen externref-growable guard, then
        # `next build` emits the static export.
        run: pnpm build
        # GithubInfo (nav) fetches repo stars at build time. Authenticate so the
        # shared-runner IP doesn't hit the 60/hr unauthenticated rate limit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
